name: Avisos de capítulos nuevos

on:
  schedule:
    - cron: '7,37 * * * *'   # cada media hora
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar también un aviso de prueba'
        type: boolean
        default: false

permissions:
  contents: write   # solo para el commit vacío que mantiene vivos los avisos

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recuperar la hora de la última comprobación
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: avisos-${{ github.run_id }}
          restore-keys: avisos-

      - name: Instalar la librería de avisos
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7

      - name: Buscar capítulos nuevos y avisar
        run: node avisos/avisos.mjs
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PRUEBA: ${{ inputs.prueba }}

      - name: Guardar la hora de esta comprobación
        uses: actions/cache/save@v4
        with:
          path: estado
          key: avisos-${{ github.run_id }}

      # GitHub apaga las tareas programadas de un repositorio sin cambios en 60 días
      - name: Mantener activos los avisos
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activos los avisos"
            git push
          fi
